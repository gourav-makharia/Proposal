<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little Story ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hearts"></div>

    <div class="container">

        <!-- PAGE 1 -->
        <div id="page1">

<h1>Hello ❤️</h1>

<p id="typing">
    Hey...
    <br><br>
    I'm really happy you opened this.
    <br><br>
    I've been wanting to ask you something
    for quite a while now...
</p>
            <button id="startBtn">
                Let's Begin ❤️
            </button>

        </div>

        <!-- PAGE 2 -->
        <div id="page2" class="hidden">

            <h2>😊 Hi...</h2>

            <p>
                Thank you for opening this little surprise...
                <br><br>
                I promise it'll only take about a minute... ❤️
            </p>

            <button id="continueBtn">
                Continue →
            </button>

        </div>

        <!-- PAGE 3 -->
        <div id="page3" class="hidden">

            <h2>💌</h2>

            <p id="storyText"></p>

            <button id="nextBtn" class="hidden">
                Next →
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
