<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
text-align:center;
max-width:420px;
position:relative;
}

h1{
color:#ff4081;
margin-bottom:15px;
}

p{
margin-bottom:30px;
font-size:18px;
}

button{
padding:12px 30px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

#yes{
background:#ff4081;
color:white;
margin-right:15px;
}

#yes:hover{
transform:scale(1.1);
}

#no{
background:#ddd;
position:absolute;
}

.hearts{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
}

.heart{
position:absolute;
color:red;
font-size:24px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}

</style>

</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="card">

<h1>Hi ❤️</h1>

<p>Will you go on a date with me? 😊</p>

<button id="yes">Yes 💖</button>

<button id="no">No 😒</button>

</div>

<script>

const no=document.getElementById("no");

no.style.left="220px";
no.style.top="210px";

no.addEventListener("mouseover",()=>{

const x=Math.random()*(window.innerWidth-150);
const y=Math.random()*(window.innerHeight-100);

no.style.left=x+"px";
no.style.top=y+"px";

});

document.getElementById("yes").onclick=function(){

document.body.innerHTML=`
<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;background:#ffe6f0;">
<h1 style="font-size:60px;color:#ff1493;">🎉 YAY!! 🎉</h1>
<h2 style="margin-top:20px;">You just made my day ❤️</h2>
</div>
`;

}

setInterval(()=>{

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";

document.getElementById("hearts").appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},300);

</script>

</body>
</html>
